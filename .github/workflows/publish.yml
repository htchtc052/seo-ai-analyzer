name: Publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seo_ai_analyzer
          POSTGRES_USER: seo_ai_analyzer
          POSTGRES_PASSWORD: seo_ai_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo_ai_analyzer -d seo_ai_analyzer"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://seo_ai_analyzer:seo_ai_analyzer@localhost:5432/seo_ai_analyzer?schema=public
      REDIS_URL: redis://localhost:6379
      LLM_BASE_URL: http://127.0.0.1:11434/v1
      LLM_API_KEY: test
      LLM_EMBEDDING_MODEL: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm exec -w @seo-ai-analyzer/api -- prisma migrate deploy

      - run: npm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/.docker/Dockerfile
          push: true
          tags: ghcr.io/htchtc052/seo-ai-analyzer-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
